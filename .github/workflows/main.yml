name: Build EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4   # ← updated to latest

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5   # ← latest
        with:
          python-version: '3.11'

      - name: 📦 Install dependencies
        shell: cmd
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          if exist requirements.txt (pip install -r requirements.txt)

      - name: 🛠️ Build with PyInstaller
        shell: cmd
        run: |
          pyinstaller --noconfirm --onefile --windowed ^
            --add-data "PluginAPI;PluginAPI" ^
            --collect-all PluginAPI ^
            MARSCT.py

      - name: 📤 Upload EXE as artifact
        uses: actions/upload-artifact@v4
        with:
          name: MARSCT
          path: dist/MARSCT.exe          # ← single file, no trailing slash or folder
